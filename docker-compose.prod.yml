# Production stack: one Nginx, one API, one worker, one database.
#
# Attachments live in an external S3-compatible bucket (OCI Object Storage on
# the Oracle deployment), not in a container here: see S3_* in
# .env.production.example.
#
# Exactly one API instance for now. Socket.IO keeps connection state in memory,
# so a second instance would leave clients connected to a process that never
# hears about their events. See docs/deploy.md before scaling out.

# Docker keeps container logs forever by default, and a JSON log file will
# quietly fill the disk on a server nobody is watching. Thirty megabytes per
# container is enough to debug yesterday and bounded enough to forget about.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the API and the backup job need it.
    expose:
      - '5432'

    logging: *default-logging
  # Runs once, to completion, before the API starts.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: 'no'
    command: ['node', 'dist/db/migrate.js']
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy

    logging: *default-logging
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    labels:
      autoheal: 'true'
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PORT: '4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '4000'

    logging: *default-logging
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    labels:
      autoheal: 'true'
    command: ['node', 'dist/worker.js']
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      # The worker has no HTTP interface of its own, so it serves a health
      # endpoint purely so the container can be restarted when it wedges.
      WORKER_HEALTH_PORT: '4001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4001/health']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging: *default-logging
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The certificate paths contain the domain, so nginx is templated.
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME must be set in .env.production}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Read-write: the entrypoint writes a self-signed placeholder here on
      # the very first boot so nginx can start and answer the ACME challenge.
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot:ro
    logging: *default-logging

  # Issues the first certificate and renews it afterwards. Webroot mode, so
  # nginx keeps running throughout: standalone mode wants port 80 to itself,
  # which means taking the site down to renew.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    # Twice a day is what Let's Encrypt asks for. `renew` is a no-op until a
    # certificate is inside thirty days of expiry, so this is almost always
    # a few milliseconds and a line in the log.
    #
    # The deploy hook only leaves a note. Reloading nginx from in here would
    # mean reaching into another container, which needs the Docker socket,
    # and handing the socket to the thing that talks to the public internet
    # is a poor trade for a reload. The web container watches instead: see
    # docker/entrypoint.d/20-watch-for-renewals.sh.
    entrypoint: /bin/sh
    command: >
      -c 'trap exit TERM;
      while :; do
      certbot renew --webroot --webroot-path /var/www/certbot --quiet
      --deploy-hook "date -u +%FT%TZ > /etc/letsencrypt/last-renewal";
      sleep 12h & wait $${!};
      done'
    logging: *default-logging

  # restart: unless-stopped only covers a process that exits. A container that
  # is running but failing its health check would sit there indefinitely, which
  # is exactly the case a health check exists to catch, so something has to act
  # on it.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: '30'
      AUTOHEAL_START_PERIOD: '60'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    logging: *default-logging
  # Nightly pg_dump, kept for fourteen days. See scripts/backup.sh.
  backup:
    # Built, not pulled: the job needs pg_dump and an S3 client in the same
    # place, and the stock postgres image has no way to reach the off-site
    # bucket.
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
