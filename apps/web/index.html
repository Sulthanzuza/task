<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Plus Jakarta Sans. Preconnected because the font is on the critical path:
      the whole interface is set in it, so a late swap is a visible reflow.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    />

    <!--
      Set the theme before the first paint. Left to React this would flash the
      default dark page at somebody who chose light.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('tm-theme');
        } catch (error) {
          /* Private browsing can block storage; the system preference still works. */
        }
        var themes = ['midnight', 'dusk', 'light', 'violet'];
        if (themes.indexOf(theme) === -1) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'midnight';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <title>Team Task Manager</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
