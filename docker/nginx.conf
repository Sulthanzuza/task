# The single public entry point: the app and the API on one origin.
#
# Serving both from here is what makes the session cookie a first-party cookie
# and removes CORS from the picture entirely. It is also what the Vite dev
# proxy imitates, so development and production behave the same way.

upstream api_upstream {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # TLS is terminated here in a real deployment. The certificate paths are
    # left commented because they depend on how certbot is run; see deploy.md.
    #
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/tasks.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tasks.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # An upload is the only large body; everything else is small. This must
    # agree with MAX_UPLOAD_BYTES, or Nginx refuses what the API would accept.
    client_max_body_size 25m;
    client_body_timeout 60s;

    # The API sets its own security headers. These cover the static files,
    # which Nginx serves without ever reaching the application.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # For the container health check; answered without touching the app.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # The API trusts exactly one proxy, and this is it. Without these the
        # rate limiter would see every request as coming from Nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # Without these two the connection never becomes a websocket and the
        # client silently falls back to long polling.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than Socket.IO's 25 second ping interval, or Nginx would close
        # an idle but perfectly healthy connection every time.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Buffering a stream defeats the point of having one.
        proxy_buffering off;
    }

    # Hashed assets never change, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy leaves people on the old app
    # pointing at asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Everything else is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
