<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Plus Jakarta Sans, served from here rather than from a CDN.
      
      The whole interface is set in it, so it is on the critical path, and a
      request to another origin on that path is a dependency on somebody
      else's DNS. One blip failed nineteen end-to-end tests at once. The
      latin subset of the variable font is 27KB; preloaded, because a late
      swap is a visible reflow.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      crossorigin
    />

    <!--
      Set the theme before the first paint. Left to React this would flash the
      default dark page at somebody who chose light.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('tm-theme');
        } catch (error) {
          /* Private browsing can block storage; the system preference still works. */
        }
        var themes = ['midnight', 'dusk', 'light', 'violet'];
        if (themes.indexOf(theme) === -1) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'midnight';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <title>Team Task Manager</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
