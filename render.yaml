# Render Blueprint: one free web service, everything in one process.
#
# Render → New → Blueprint → this repository. Values marked `sync: false` are
# secrets or per-deployment values: Render asks for each one when the
# Blueprint is first applied and never reads them from this file. See
# docs/deploy-render.md for where every value comes from.
#
# What the free plan does not have, and what this file does instead:
#   - No pre-deploy command: the image's start command runs migrations first
#     (docker/render.Dockerfile).
#   - No Shell or one-off jobs: the first administrator is created from your
#     own machine against the database (docs/deploy-render.md).
#   - Outbound SMTP is blocked: the launch sends no email at all
#     (MAIL_TRANSPORT=none); Brevo's HTTP API can be switched on later.
#   - The disk is ephemeral: attachments live in Supabase Storage.

services:
  - type: web
    name: taskmanager
    runtime: docker
    plan: free
    # Render has no region in India; Singapore is the nearest, and the
    # Supabase project is in Singapore too, so database round trips stay local.
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./docker/render.Dockerfile
    dockerContext: .
    # /ready, not /health: it fails when the database or the job queue is
    # unreachable, which is when Render should not route traffic here.
    healthCheckPath: /api/v1/ready

    envVars:
      # ---- Process -----------------------------------------------------------
      - key: NODE_ENV
        value: production
      - key: RUN_MODE
        value: all
      - key: WEB_DIST_DIR
        value: /app/web
      # 384 MB of heap in a 512 MB instance; the rest is for argon2, buffers
      # and Node itself.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Render's load balancer appends exactly one address to X-Forwarded-For.
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: LOG_LEVEL
        value: info

      # ---- Origins -----------------------------------------------------------
      # The service's own address, https://<service>.onrender.com, exactly as
      # the dashboard shows it, no trailing slash. Invitation and reset links
      # are built from it. A custom domain replaces it later.
      - key: WEB_ORIGIN
        sync: false
      # Empty: the app and the API are one origin, and WEB_ORIGIN is always
      # allowed, so there is no other origin to list.
      - key: CORS_ORIGINS
        value: ''
      # Empty: a host-only session cookie, for <service>.onrender.com alone.
      # onrender.com is a public suffix shared by every Render app; browsers
      # refuse a cookie set for it, and it must never be set to that.
      - key: COOKIE_DOMAIN
        value: ''

      # ---- Database: Supabase, Session pooler --------------------------------
      # Connect → Session pooler: postgresql://postgres.<ref>:<password>@
      # aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres, with nothing
      # after it: no ?sslmode, which would override the certificate below.
      # Not the direct connection (IPv6 only, which Render cannot reach) and
      # not the Transaction pooler on 6543 (pg-boss needs a session).
      - key: DATABASE_URL
        sync: false
      # Supabase's CA, as PEM: Database Settings → SSL Configuration →
      # Download certificate. Every connection is TLS and verified against it,
      # host name included; production refuses to start without it.
      - key: DATABASE_CA_CERT
        sync: false
      # Every connection this process may hold, pg-boss's included: 3 + 2.
      - key: DATABASE_MAX_CONNECTIONS
        value: '5'

      # ---- Auth --------------------------------------------------------------
      # Generated by Render once, on the first apply; nobody needs to know it.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ARGON2_MEMORY_COST
        value: '19456'
      - key: ARGON2_TIME_COST
        value: '2'
      - key: ARGON2_PARALLELISM
        value: '1'

      # ---- Email: off at launch ----------------------------------------------
      # none: no email. The app starts with a warning saying so. Admins copy
      # invitation and reset links from Admin → People; notifications and the
      # digest are in the app.
      #
      # To turn email on later (docs/deploy-render.md, "Later: email"): set
      # MAIL_TRANSPORT to brevo-api in the dashboard and add BREVO_API_KEY
      # (xkeysib-...) and MAIL_FROM ("Task Manager <no-reply@your-domain>").
      # They are not listed here, so the Blueprint does not ask for them.
      - key: MAIL_ENABLED
        value: 'true'
      - key: MAIL_TRANSPORT
        value: none

      # ---- Jobs --------------------------------------------------------------
      - key: JOB_QUEUE_ENABLED
        value: 'true'

      # ---- Files: Supabase Storage, S3 protocol ------------------------------
      - key: STORAGE_DRIVER
        value: s3
      # https://<ref>.storage.supabase.co/storage/v1/s3
      - key: S3_ENDPOINT
        sync: false
      # The Supabase project's region: Southeast Asia (Singapore).
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: task-attachments
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # Supabase Storage does not support S3 checksums; the AWS SDK sends them
      # by default unless told to send them only where S3 requires one.
      - key: AWS_REQUEST_CHECKSUM_CALCULATION
        value: WHEN_REQUIRED
      - key: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: WHEN_REQUIRED
