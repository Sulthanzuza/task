# Production stack: one Nginx, one API, one worker, one database.
#
# Exactly one API instance for now. Socket.IO keeps connection state in memory,
# so a second instance would leave clients connected to a process that never
# hears about their events. See docs/deploy.md before scaling out.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the API and the backup job need it.
    expose:
      - '5432'

  # Runs once, to completion, before the API starts.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: 'no'
    command: ['node', 'dist/db/migrate.js']
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    labels:
      autoheal: 'true'
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PORT: '4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '4000'

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    labels:
      autoheal: 'true'
    command: ['node', 'dist/worker.js']
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      # The worker has no HTTP interface of its own, so it serves a health
      # endpoint purely so the container can be restarted when it wedges.
      WORKER_HEALTH_PORT: '4001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4001/health']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      # - '443:443'
    volumes:
      - ./certs:/etc/letsencrypt:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - '9000'

  # restart: unless-stopped only covers a process that exits. A container that
  # is running but failing its health check would sit there indefinitely, which
  # is exactly the case a health check exists to catch, so something has to act
  # on it.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: '30'
      AUTOHEAL_START_PERIOD: '60'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Nightly pg_dump, kept for fourteen days. See scripts/backup.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.production]
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
