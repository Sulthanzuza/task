name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  verify:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @tm/shared build

      - run: pnpm typecheck

      - run: pnpm lint

      # A known-vulnerable dependency is a build failure, not a note in a
      # report nobody reads.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      # The API integration tests start their own Postgres through Testcontainers,
      # which needs the Docker daemon the runner already provides.
      - run: pnpm test
        env:
          NODE_ENV: test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
          POSTGRES_DB: taskmanager
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The suite checks that a notification email really arrives, so it needs
      # somewhere for the worker to send it.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

    env:
      E2E_DATABASE_URL: postgres://taskmanager:taskmanager@localhost:5433/taskmanager_e2e
      # The suite sets its own ports; these only have to be free on the runner.
      E2E_API_PORT: 4100
      E2E_WEB_PORT: 5199
      E2E_WORKER_PORT: 4101
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_SMTP_HOST: localhost
      E2E_SMTP_PORT: '1025'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium is ~150MB; cache it against the resolved Playwright version so a
      # dependency bump invalidates the cache instead of using a stale browser.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          VERSION=$(pnpm --filter @tm/web exec playwright --version | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore the browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tm/web exec playwright install --with-deps chromium

      # A cached browser still needs the system libraries it links against.
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tm/web exec playwright install-deps chromium

      - run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/.report
          retention-days: 7

      - name: Upload traces and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web/e2e/.artifacts
          retention-days: 7

      # Committed screenshots: on failure these show what the run actually rendered.
      - name: Upload the captured screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/e2e/screenshots
          retention-days: 7

  deploy:
    name: Deploy
    # Tags only, and only once everything has passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/taskmanager
            git fetch --tags --prune
            git checkout --force ${{ github.ref_name }}
            # Migrations run as their own service, before the API starts.
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps

      - name: Wait for the deployment to report ready
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ secrets.DEPLOY_BASE_URL }}/api/v1/ready" > /dev/null; then
              echo "ready after $attempt attempts"
              exit 0
            fi
            sleep 5
          done
          echo "The deployment never reported ready" >&2
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @tm/web exec playwright install --with-deps chromium

      # The real check that the deploy worked, against the live site, as a
      # dedicated account with ordinary member rights.
      - name: Smoke test the deployment
        env:
          BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: pnpm smoke

      - name: Upload the smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            apps/web/e2e/.smoke-report
            apps/web/e2e/.smoke-artifacts
          retention-days: 7
